<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Dispatcher</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:Arial,sans-serif;
      background:radial-gradient(circle at top left,rgba(56,189,248,.16),transparent 30%),
      radial-gradient(circle at bottom right,rgba(168,85,247,.13),transparent 35%),#030712;
      color:white;
      min-height:100vh;
      padding:28px;
    }
    .container{max-width:1200px;margin:0 auto}
    .logo{display:flex;align-items:center;gap:14px;margin-bottom:24px}
    .logo-icon{
      width:54px;height:54px;border-radius:18px;
      background:linear-gradient(135deg,#38bdf8,#8b5cf6);
      display:flex;align-items:center;justify-content:center;font-size:24px;
    }
    h1{font-size:32px}
    .subtitle{color:#94a3b8;font-size:14px;margin-top:4px}
    .card,.agent,.brain-card,.history-item{
      background:rgba(15,23,42,.82);
      border:1px solid rgba(148,163,184,.16);
      border-radius:24px;
      padding:22px;
      margin-bottom:22px;
      box-shadow:0 15px 40px rgba(0,0,0,.24);
    }
    textarea{
      width:100%;height:160px;background:#0f172a;color:white;
      border:1px solid rgba(148,163,184,.2);
      border-radius:20px;padding:18px;font-size:16px;resize:vertical;outline:none;
      margin-top:14px;
    }
    button{
      border:none;cursor:pointer;padding:12px 18px;border-radius:14px;
      font-weight:bold;margin-top:14px;margin-right:10px;
    }
    .primary{background:#38bdf8;color:#03131f}
    .secondary{background:#111827;color:white;border:1px solid rgba(148,163,184,.2)}
    .danger{background:#7f1d1d;color:white}
    .brain,.agents{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:18px;
      margin-top:20px;
    }
    .brain-card ul{padding-left:18px;color:#cbd5e1;line-height:1.7;margin-top:10px}
    .agent-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .agent-name{font-size:20px;font-weight:bold}
    .badge{
      background:rgba(56,189,248,.14);
      color:#7dd3fc;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
    }
    .task{
      background:#111827;
      border:1px solid rgba(148,163,184,.12);
      border-radius:16px;
      padding:14px;
      margin-bottom:12px;
    }
    .task-title{font-size:18px;margin-bottom:8px}
    .task-status{font-size:13px;margin-bottom:10px}
    .history{margin-top:30px}
    .history-date{color:#94a3b8;font-size:13px;margin-bottom:8px}
    @media(max-width:768px){
      body{padding:16px}
      h1{font-size:24px}
      textarea{height:210px}
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <div class="logo-icon">🧠</div>
    <div>
      <h1>AI Dispatcher</h1>
      <div class="subtitle">Второй мозг • контроль задач • фокус дня</div>
    </div>
  </div>

  <div class="card">
    <h2>✍️ Напиши всё, что у тебя в голове</h2>
    <textarea id="inputText" placeholder="Например: завтра встретить сына, помочь маме с краской, проверить рекламу, сделать контент, ответить клиентам..."></textarea>
    <button class="primary" onclick="analyzeDay()">Разобрать день</button>
    <button class="secondary" onclick="clearAll()">Сбросить всё</button>
  </div>

  <div id="brainSection"></div>

  <div class="agents" id="agentsContainer"></div>

  <div class="history">
    <h2>📚 История разборов</h2>
    <div id="historyContainer"></div>
  </div>

</div>

<script>
const agents = {
  "COMMANDER": [],
  "FAMILY": [],
  "HOME MANAGER": [],
  "CONTENT": [],
  "SALES": [],
  "CONTROL": []
};

function makeTask(text){
  return {
    text:text,
    status:"Новая"
  };
}

function saveData(){
  localStorage.setItem("aiDispatcherData", JSON.stringify(agents));
}

function loadData(){
  const saved = localStorage.getItem("aiDispatcherData");
  if(saved){
    const parsed = JSON.parse(saved);
    Object.keys(agents).forEach(agent=>{
      agents[agent] = parsed[agent] || [];
    });
  }
}

function saveHistory(item){
  let history = JSON.parse(localStorage.getItem("dispatcherHistory") || "[]");
  history.unshift(item);
  localStorage.setItem("dispatcherHistory", JSON.stringify(history));
  renderHistory();
}

function renderHistory(){
  const history = JSON.parse(localStorage.getItem("dispatcherHistory") || "[]");
  const container = document.getElementById("historyContainer");
  container.innerHTML = "";

  history.forEach(item=>{
    container.innerHTML += `
      <div class="history-item">
        <div class="history-date">${item.date}</div>
        <div>${item.focus}</div>
      </div>
    `;
  });
}

function analyzeDay(){
  const text = document.getElementById("inputText").value.trim().toLowerCase();
  if(!text) return;

  Object.keys(agents).forEach(agent=>{
    agents[agent] = [];
  });

  agents["COMMANDER"].push(makeTask("Не перегружать день"));
  agents["COMMANDER"].push(makeTask("Главный приоритет — семья"));

  agents["CONTROL"].push(makeTask("Только 3 главные задачи"));
  agents["CONTROL"].push(makeTask("Не начинать новые проекты"));

  if(text.includes("сын") || text.includes("сем") || text.includes("родствен")){
    agents["FAMILY"].push(makeTask("Организовать встречу сына"));
    agents["FAMILY"].push(makeTask("Семейный вечер"));
  }

  if(text.includes("мам") || text.includes("краск") || text.includes("дом") || text.includes("материал") || text.includes("посуд")){
    agents["HOME MANAGER"].push(makeTask("Помочь маме"));
    agents["HOME MANAGER"].push(makeTask("Покупка краски"));
    agents["HOME MANAGER"].push(makeTask("Отвезти материалы и посуду"));
  }

  if(text.includes("контент") || text.includes("пост") || text.includes("сторис") || text.includes("сайт") || text.includes("reels")){
    agents["CONTENT"].push(makeTask("Сделать 1 короткий пост или сторис"));
    agents["CONTENT"].push(makeTask("Проверить сайт без глубоких правок"));
  }

  if(text.includes("клиент") || text.includes("реклам") || text.includes("заявк") || text.includes("продвиж")){
    agents["SALES"].push(makeTask("Проверить рекламу"));
    agents["SALES"].push(makeTask("Ответить горячим клиентам"));
  }

  saveData();
  renderBrain();
  renderAgents();

  saveHistory({
    date:new Date().toLocaleString(),
    focus:"Главный фокус: семья, спокойствие и контроль над важными задачами."
  });
}

function renderBrain(){
  document.getElementById("brainSection").innerHTML = `
    <div class="card">
      <h2>🧠 DISPATCHER SUMMARY</h2>

      <div class="brain">
        <div class="brain-card">
          <h3>🔥 Главный фокус</h3>
          <ul>
            <li>Семья и спокойный день</li>
            <li>Не перегружать себя</li>
          </ul>
        </div>

        <div class="brain-card">
          <h3>✅ Обязательно</h3>
          <ul>
            <li>Помочь маме</li>
            <li>Встретить сына</li>
            <li>Проверить рекламу</li>
          </ul>
        </div>

        <div class="brain-card">
          <h3>⛔ НЕ делать</h3>
          <ul>
            <li>Не начинать новые проекты</li>
            <li>Не уходить в хаос</li>
            <li>Не сидеть весь день в телефоне</li>
          </ul>
        </div>

        <div class="brain-card">
          <h3>💰 Что даст результат</h3>
          <ul>
            <li>Ответить горячим клиентам</li>
            <li>1 короткий пост или сторис</li>
          </ul>
        </div>

        <div class="brain-card">
          <h3>⚡ Нагрузка</h3>
          <ul>
            <li>Средняя</li>
          </ul>
        </div>

        <div class="brain-card">
          <h3>🛰️ Совет DISPATCHER</h3>
          <ul>
            <li>Сегодня семья важнее продуктивности.</li>
          </ul>
        </div>
      </div>
    </div>
  `;
}

function renderAgents(){
  const container = document.getElementById("agentsContainer");
  container.innerHTML = "";

  Object.keys(agents).forEach(agent=>{
    let tasksHTML = "";

    if(agents[agent].length === 0){
      tasksHTML = `<div class="task">Нет задач</div>`;
    } else {
      agents[agent].forEach((task,index)=>{
        const status = task.status || "Новая";

        let color = "#86efac";
        if(status === "В работе") color = "#facc15";
        if(status === "Выполнено") color = "#38bdf8";

        tasksHTML += `
          <div class="task">
            <div class="task-title">${task.text}</div>
            <div class="task-status" style="color:${color};">${status}</div>

            <button class="secondary" onclick="changeStatus('${agent}',${index},'Новая')">Новая</button>
            <button class="secondary" onclick="changeStatus('${agent}',${index},'В работе')">В работе</button>
            <button class="primary" onclick="changeStatus('${agent}',${index},'Выполнено')">Выполнено</button>
            <button class="danger" onclick="deleteTask('${agent}',${index})">Удалить</button>
          </div>
        `;
      });
    }

    container.innerHTML += `
      <div class="agent">
        <div class="agent-top">
          <div class="agent-name">${agent}</div>
          <div class="badge">${agents[agent].length} задач</div>
        </div>
        ${tasksHTML}
      </div>
    `;
  });
}

function changeStatus(agent,index,status){
  agents[agent][index].status = status;
  saveData();
  renderAgents();
}

function deleteTask(agent,index){
  agents[agent].splice(index,1);
  saveData();
  renderAgents();
}

function clearAll(){
  localStorage.removeItem("aiDispatcherData");
  localStorage.removeItem("dispatcherHistory");
  location.reload();
}

loadData();
renderAgents();
renderHistory();
</script>

</body>
</html>
